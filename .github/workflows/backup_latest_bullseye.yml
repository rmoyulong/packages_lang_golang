name: 备份mini armbian Bullseye镜像

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/backup_latest_bullseye.yml'

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: 获取上游所有含 amlogic 的 .img.gz 下载链接
        id: get_urls
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRC_REPO="Woiui/amlogic-s9xxx-armbian"
          SRC_TAG="Armbian_bullseye_save_2024.02"

          # 先按 tag 取 release id
          REL_ID=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${SRC_REPO}/releases/tags/${SRC_TAG}" \
            | jq -r '.id // empty')
          if [ -z "$REL_ID" ]; then
            echo "未找到 tag ${SRC_TAG} 对应的 release" >&2
            exit 1
          fi

          # 分页拉取全部 assets，筛出名字含 amlogic 且以 .img.gz 结尾的
          urls=""
          page=1
          while :; do
            page_json=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${SRC_REPO}/releases/${REL_ID}/assets?per_page=100&page=${page}")
            n=$(echo "$page_json" | jq 'length')
            [ "$n" -eq 0 ] && break
            part=$(echo "$page_json" \
              | jq -r '.[] | select(.name | test("amlogic_s905.*\\.img\\.gz$"; "i")) | .browser_download_url')
            [ -n "$part" ] && urls+="${part}"$'\n'
            page=$((page+1))
          done
          urls=$(printf '%s' "$urls" | sed '/^$/d')

          if [ -z "$urls" ]; then
            echo "未找到任何含 amlogic 的 .img.gz 资产" >&2
            exit 1
          fi

          echo "匹配到以下文件："
          echo "$urls"
          {
            echo "urls<<EOF"
            echo "$urls"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 下载筛选后的 .img.gz
        run: |
          set -euo pipefail
          mkdir -p downloads
          cd downloads
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            echo "下载: $u"
            curl -L --retry 3 --retry-delay 5 -o "$(basename "$u")" "$u"
          done <<< "${{ steps.get_urls.outputs.urls }}"
          echo "---- 下载结果 ----"
          ls -lh
        
      - name: 逐文件下载并上传（串行，避免并发/磁盘问题）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 确保 release 存在
          gh release view backup_mini_bullseye -R "$REPO" >/dev/null 2>&1 || \
            gh release create backup_mini_bullseye -R "$REPO" \
              --title "Backup Armbian_bullseye_save_2025.01 (amlogic *.img.gz)" \
              --notes "自动备份自 SergeyKa2021/amlogic-s9xxx-armbian 的 Armbian_bullseye_save_2024.03"

          mkdir -p downloads
          total=0
          ok=0
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            total=$((total+1))
            f="downloads/$(basename "$u")"
            echo "=== [$total] 下载: $(basename "$u") ==="
            if ! curl -L --retry 5 --retry-delay 10 --retry-all-errors -C - -o "$f" "$u"; then
              echo "下载失败，跳过: $u" >&2
              rm -f "$f"
              continue
            fi
            # 简单完整性检查：gzip 头
            if ! gzip -t "$f" 2>/dev/null; then
              echo "文件损坏，跳过: $f" >&2
              rm -f "$f"
              continue
            fi
            echo "=== [$total] 上传: $(basename "$f") ==="
            if gh release upload backup_mini_bullseye "$f" -R "$REPO" --clobber; then
              ok=$((ok+1))
            else
              echo "上传失败，保留文件待查: $f" >&2
              continue
            fi
            rm -f "$f"
          done <<< "${{ steps.get_urls.outputs.urls }}"

          echo "完成：成功 ${ok}/${total}"
          if [ "$ok" -eq 0 ]; then
            echo "没有任何文件成功上传" >&2
            exit 1
          fi          
