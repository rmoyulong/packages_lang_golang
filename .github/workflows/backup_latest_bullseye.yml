name: 备份最后一版armbian Bullseye镜像

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/backup_latest_bullseye.yml'

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: 获取上游所有含 amlogic 的 .img.gz 下载链接
        id: get_urls
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRC_REPO="yifengyou/amlogic-s9xxx-armbian"
          SRC_TAG="Armbian_bullseye_save_2025.01"

          # 先按 tag 取 release id
          REL_ID=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${SRC_REPO}/releases/tags/${SRC_TAG}" \
            | jq -r '.id // empty')
          if [ -z "$REL_ID" ]; then
            echo "未找到 tag ${SRC_TAG} 对应的 release" >&2
            exit 1
          fi

          # 分页拉取全部 assets，筛出名字含 amlogic 且以 .img.gz 结尾的
          #方案 C：还想只留 s905 系（排除 s905x/s912 等）
          #select(.name | test("^Armbian_.*_amlogic_s905(_|_).*bullseye.*\\.img\\.gz$"; "i"))
          urls=""
          page=1
          while :; do
            page_json=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${SRC_REPO}/releases/${REL_ID}/assets?per_page=100&page=${page}")
            n=$(echo "$page_json" | jq 'length')
            [ "$n" -eq 0 ] && break
            part=$(echo "$page_json" \
              | jq -r '.[] | select(.name | test("^Armbian_.*_amlogic_.*_bullseye_.*\\.img\\.gz$"; "i"))
            [ -n "$part" ] && urls+="${part}"$'\n'
            page=$((page+1))
          done
          urls=$(printf '%s' "$urls" | sed '/^$/d')

          if [ -z "$urls" ]; then
            echo "未找到任何含 amlogic 的 .img.gz 资产" >&2
            exit 1
          fi

          echo "匹配到以下文件："
          echo "$urls"
          {
            echo "urls<<EOF"
            echo "$urls"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 下载筛选后的 .img.gz
        run: |
          set -euo pipefail
          mkdir -p downloads
          cd downloads
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            echo "下载: $u"
            curl -L --retry 3 --retry-delay 5 -o "$(basename "$u")" "$u"
          done <<< "${{ steps.get_urls.outputs.urls }}"
          echo "---- 下载结果 ----"
          ls -lh

      - name: 创建或更新 release 并上传资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backup_latest_bullseye
          name: Backup bullseye_save_2025.01 (amlogic *.img.gz)
          body: |
            自动备份自 `yifengyou/amlogic-s9xxx-armbian` 的 `bullseye_save_2025.01` tag。
            仅包含文件名含 `amlogic` 的 `*.img.gz` 资产。
            运行 ID：${{ github.run_id }}
          files: downloads/*.img.gz
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
